name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"

            - name: Setup pnpm (using Corepack)
              run: |
                  corepack enable
                  corepack prepare pnpm@10 --activate

            - name: Install dependencies
              run: pnpm install

            - name: Lint
              run: pnpm lint --if-present

            - name: Test
              run: pnpm test --if-present

            - name: Build
              run: pnpm build
